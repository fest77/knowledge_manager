<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库管理平台</title>
<style>
  :root{
    --brand:#223248; --fg:#1f2d3d; --muted:#6b7280; --dim:#9ca3af;
    --border:#e5e7eb; --bg:#f5f7fa; --white:#fff; --danger:#dc2626; --ok:#059669;
    --side-fg:#c9d4e2; --side-active:#2b3f58;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 "Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
  a{color:var(--brand)}
  button{font-family:inherit}

  /* ---------- 通用 ---------- */
  .card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px}
  .card h2{margin:0 0 4px;font-size:16px}
  .card .sub{color:var(--dim);font-size:12px;margin:0 0 16px}
  hr{border:0;border-top:1px solid var(--border);margin:16px 0}
  label{display:block;font-weight:600;margin:0 0 6px;font-size:13px}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
        font-size:14px;font-family:inherit;outline:none;background:var(--white)}
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,50,72,.08)}
  input:disabled{background:#f3f4f6;color:var(--muted)}
  .btn{padding:9px 16px;border:1px solid var(--brand);border-radius:8px;background:var(--brand);
       color:#fff;font-size:14px;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.ghost{background:var(--white);color:var(--fg);border-color:var(--border)}
  .btn.ghost:hover{border-color:var(--brand)}
  .row{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--border)}
  .row:last-child{border-bottom:0}
  .k{width:110px;flex:none;color:var(--muted);font-size:13px}
  .v{flex:1;word-break:break-all}
  .tag{display:inline-block;margin:3px 6px 3px 0;padding:2px 9px;border-radius:999px;
       background:#eef2f7;color:var(--brand);font-size:12px}
  .tag.ok{background:#ecfdf5;color:var(--ok)}
  .err{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:#fef2f2;
       border:1px solid #fecaca;color:var(--danger);font-size:13px}
  .ok-msg{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:#ecfdf5;
       border:1px solid #a7f3d0;color:var(--ok);font-size:13px}
  code{background:#f3f4f6;padding:1px 6px;border-radius:4px;font-size:12px}
  .muted{color:var(--dim);font-size:12px}

  /* ---------- 登录页 ---------- */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center}
  #loginView .card{width:100%;max-width:460px;padding:32px;
       box-shadow:0 1px 3px rgba(16,24,40,.06)}
  #loginView h1{font-size:26px;margin:0 0 6px;color:var(--brand)}
  #loginView .sub-line{color:var(--muted);font-size:13px;margin:0 0 22px}
  #loginView .btn{width:100%;margin-top:22px;padding:11px;font-size:15px}
  #loginView .foot{color:var(--dim);font-size:12px;margin-top:16px;line-height:1.7}

  /* ---------- 应用壳 ---------- */
  #appView{display:none;min-height:100vh}
  #appView.on{display:flex}
  aside{width:214px;flex:none;background:var(--brand);color:var(--side-fg);
        display:flex;flex-direction:column;padding:18px 0}
  aside .brand{font-size:17px;font-weight:700;color:#fff;padding:0 20px 4px}
  aside .brand-sub{font-size:11px;color:#8fa3bb;padding:0 20px 18px}
  nav a{display:flex;align-items:center;gap:8px;padding:10px 20px;color:var(--side-fg);
        text-decoration:none;font-size:14px;border-left:3px solid transparent}
  nav a:hover{background:var(--side-active);color:#fff}
  nav a.active{background:var(--side-active);color:#fff;border-left-color:#7aa7d9}
  nav a.pending{color:#6d7f94;cursor:not-allowed}
  nav a.pending:hover{background:transparent;color:#6d7f94}
  nav a .badge{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:999px;
        background:#3a4f6b;color:#9fb4cc}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{height:58px;flex:none;background:var(--white);border-bottom:1px solid var(--border);
         display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  header .who{color:var(--muted);font-size:13px}
  #outlet{padding:24px;max-width:1040px;width:100%}
  .cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
  .cfg-item .lbl{font-weight:600;font-size:13px;margin-bottom:6px}
  .cfg-item .desc{color:var(--dim);font-size:11px;margin-top:4px}
  .cfg-actions{margin-top:20px;display:flex;gap:10px;align-items:center}

  /* ---------- 审计日志页（模块 10） ---------- */
  .filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;
       border:1px solid var(--border);border-radius:10px;padding:16px;background:#fafbfc}
  .filters-title{grid-column:1/-1;font-weight:600;font-size:13px;color:var(--muted)}
  .fld label{font-weight:600;font-size:12px;margin-bottom:4px;color:var(--muted)}
  .fld select[multiple]{height:auto;padding:6px}
  .au-summary{margin:16px 0 8px;font-size:13px;color:var(--muted)}
  .au-table-box{overflow-x:auto}
  .tbl{border-collapse:collapse;width:100%;font-size:12.5px}
  .tbl th,.tbl td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;
       vertical-align:top;white-space:nowrap}
  .tbl th{background:#f7f9fb;font-weight:600;color:var(--muted);position:sticky;top:0}
  .tbl tbody tr,.tbl tr+tr{cursor:default}
  .tbl tr:hover td{background:#f8fafc;cursor:pointer}
  .au-pager{display:flex;gap:10px;align-items:center;margin-top:14px}
  .au-detail{margin-top:16px}
  .au-detail-inner{border:1px solid var(--border);border-radius:10px;padding:14px;
       background:#fbfcfe}
  .au-detail-head{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
  .au-snap{margin-top:10px}
  .au-snap-title{font-weight:600;font-size:12px;color:var(--muted);margin-bottom:4px}
  .au-snap pre{margin:0;background:#f3f4f6;border:1px solid var(--border);border-radius:8px;
       padding:10px;max-height:260px;overflow:auto;font-size:12px;white-space:pre-wrap;
       word-break:break-all}
  .mono{font-family:Consolas,"Courier New",monospace;font-size:12px}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;
       background:#eef2f7;color:var(--brand)}
  .pill.success{background:#ecfdf5;color:var(--ok)}
  .pill.failure{background:#fef2f2;color:var(--danger)}
  .pill.denied{background:#fff7ed;color:#b45309}
  .pill.warn{background:#fffbeb;color:#b45309}

  /* ---------- 组织架构区块（模块 02） ---------- */
  .dept-tree{list-style:none;margin:0;padding:0}
  .dept-tree ul{list-style:none;margin:0;padding:0}
  .dept-line{display:flex;align-items:center;gap:8px;padding:5px 0;
       border-bottom:1px dashed var(--border)}
  .dept-name{font-weight:600;font-size:13px}
  .dept-actions{margin-left:auto;display:flex;gap:6px}
  .btn.tiny{padding:3px 9px;font-size:12px;border-radius:6px}
  .op-cell{white-space:nowrap}
  .op-cell .btn{margin-right:4px}
  .matrix-box{margin-top:16px}
  .matrix{border:1px solid var(--border);border-radius:10px;padding:14px;background:#fbfcfe}
  .matrix-head{display:flex;align-items:center;justify-content:space-between;
       margin-bottom:10px}
  .matrix-group{font-weight:600;font-size:12px;color:var(--muted);margin:12px 0 6px}
  .matrix-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px}
  .matrix-cell{display:flex;align-items:center;gap:6px;font-size:12.5px;
       font-weight:400;margin:0;cursor:pointer}
  .matrix-cell input{width:auto;margin:0}

  /* ---------- 知识维护页（模块 03） ---------- */
  .docs-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
  .docs-side{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fafbfc}
  .cat-row{display:flex;align-items:center;gap:4px;padding:2px 0}
  .cat-name{background:none;border:0;padding:2px 4px;font:inherit;font-size:13px;
       color:var(--fg);cursor:pointer;text-align:left;flex:1}
  .cat-name:hover{color:var(--brand);text-decoration:underline}
  .cat-ops{display:flex;gap:2px}
  .docs-main{min-width:0}

  /* ---------- 导入抽屉（模块 04） ---------- */
  /* 用抽屉而不是新页面：原型 `02` 的导入队列就是「知识维护」页上的一个抽屉，
     而且导入期间用户要能继续看列表（后台任务，不阻塞界面） */
  .drawer-mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:60;
       display:flex;justify-content:flex-end}
  .drawer{width:min(680px,100%);height:100%;background:var(--white);overflow-y:auto;
       padding:22px;box-shadow:-8px 0 24px rgba(0,0,0,.18)}
  .drawer h3{margin:0 0 4px;font-size:15px}
  .drawer .drawer-head{display:flex;justify-content:space-between;align-items:start;
       margin-bottom:14px;gap:12px}
  .drop-zone{border:1px dashed #c7d2de;border-radius:10px;padding:16px;background:#fafbfc;
       text-align:center;color:var(--muted);font-size:13px}
  .drop-zone.hot{border-color:var(--brand);background:#eef2f7}
  .imp-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .imp-item{display:flex;gap:8px;align-items:center;font-size:12.5px}
  .imp-item .name{flex:1;word-break:break-all}
  .progress-track{height:6px;border-radius:999px;background:#eef2f7;overflow:hidden;
       margin-top:4px}
  .progress-fill{height:100%;background:var(--brand);width:0;transition:width .3s}
  .progress-fill.done{background:var(--ok)}
  .progress-fill.bad{background:var(--danger)}
  .q-task{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .q-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .q-name{font-size:13px;font-weight:600;word-break:break-all}
  .q-meta{font-size:12px;color:var(--dim);margin-top:2px}
  .q-ops{display:flex;gap:6px;margin-top:8px}
  .btn.mini{padding:4px 10px;font-size:12px}

  /* ---------- 四维权限弹窗（模块 05） ---------- */
  .perm-group{display:flex;flex-direction:column;gap:2px;max-height:190px;overflow-y:auto;
       border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:14px}
  .perm-group .matrix-cell{font-size:13px}

  /* ---------- 问答页（模块 06） ---------- */
  .qa-layout{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
  .qa-side{border:1px solid var(--border);border-radius:10px;padding:12px;
       background:#fafbfc;display:flex;flex-direction:column;gap:8px}
  .qa-sessions{display:flex;flex-direction:column;gap:4px;max-height:520px;overflow-y:auto}
  .qa-session{text-align:left;border:1px solid transparent;border-radius:8px;
       background:none;padding:6px 8px;cursor:pointer;font:inherit}
  .qa-session:hover{background:#eef2f7}
  .qa-session.active{background:#eef2f7;border-color:var(--brand)}
  .qa-session-title{font-size:13px;font-weight:600;margin-bottom:2px;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qa-main{min-width:0;display:flex;flex-direction:column;gap:10px}
  .qa-badge{display:flex;gap:10px;align-items:center;min-height:24px}
  .qa-thread{border:1px solid var(--border);border-radius:10px;padding:14px;
       min-height:320px;max-height:56vh;overflow-y:auto;background:var(--white)}
  .qa-msg{margin-bottom:14px}
  .qa-msg.user .qa-text{background:#eef2f7}
  .qa-role{font-size:12px;color:var(--dim);margin-bottom:4px}
  .qa-text{white-space:pre-wrap;word-break:break-word;background:#fafbfc;
       border-radius:8px;padding:10px 12px;font-size:14px}
  .qa-cites{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .qa-cite{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
  textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
       font-size:14px;font-family:inherit;outline:none;resize:vertical}
  textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,50,72,.08)}
  /* ---- 模块 09：运营看板（自绘 SVG 图表，不引 CDN） ---- */
  .dash{display:flex;flex-direction:column;gap:14px}
  .dash-toolbar{display:flex;gap:10px;align-items:center;background:var(--white);
       border:1px solid var(--border);border-radius:12px;padding:10px 14px}
  .dash-toolbar-label{font-size:13px;color:var(--muted)}
  .dash-range{padding:6px 10px;border:1px solid var(--border);border-radius:8px;
       font-size:13px;background:var(--white)}
  .dash-body{display:flex;flex-direction:column;gap:14px}
  .dash-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .dash-kpi{border:1px solid var(--border);border-radius:10px;padding:12px 14px;
       background:#fbfcfe;min-width:0}
  .dash-kpi.muted-card{background:#f7f9fb}
  .dash-kpi-label{font-size:12px;color:var(--muted);margin-bottom:6px}
  .dash-kpi-value{font-size:22px;font-weight:700;color:var(--fg);line-height:1.2;
       word-break:break-all}
  .dash-kpi-unit{font-size:12px;font-weight:400;color:var(--dim);margin-left:4px}
  .dash-kpi-foot{font-size:11px;color:var(--dim);margin-top:6px}
  .dash-chart{width:100%;height:auto;display:block;margin-top:6px}
  .dash-axis{font-size:10px;fill:var(--dim)}
  .dash-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
  .dash-legend-item{display:flex;align-items:center;gap:5px;font-size:12px;
       color:var(--muted)}
  .dash-dot{width:9px;height:9px;border-radius:999px;display:inline-block}
  .dash-note{margin:0;padding:10px 12px;border-radius:8px;background:#fffbeb;
       border:1px solid #fde68a;color:#b45309;font-size:12.5px}
  .dash-latency-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dash-rank{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .dash-rank-title{font-weight:600;font-size:13px;color:var(--muted);margin-bottom:6px}
  .dash-table-box{max-height:320px;overflow:auto}
  @media (max-width:1100px){
    .dash-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .dash-rank{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <!-- 登录视图 -->
  <section id="loginView"></section>
  <!-- 应用壳（登录后） -->
  <div id="appView">
    <aside>
      <div class="brand">知识库管理平台</div>
      <div class="brand-sub">Enterprise Knowledge Base</div>
      <nav id="nav"></nav>
    </aside>
    <main>
      <header>
        <div id="crumb" class="who"></div>
        <div style="display:flex;align-items:center;gap:14px">
          <span id="who" class="who"></span>
          <button class="btn ghost" id="logoutBtn" type="button">退出登录</button>
        </div>
      </header>
      <div id="outlet"></div>
    </main>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
